[project]
name = "kidspython-tutor-mcp"
version = "0.1.0"
description = "MCP server exposing the kidspython-tutor chatbot: lessons, KB-grounded answers, guardrails, progress, and eval tooling"
readme = "README.md"
authors = [
    { name = "Yuping Shao", email = "yshaoeng@gmail.com" }
]
requires-python = ">=3.14.0"
dependencies = [
    "fastmcp>=4.1.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.15.0",
]

[project.scripts]
kidspython-tutor-mcp = "src.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.17.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
